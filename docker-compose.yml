services:
  frontend:
    build: ./ReactFrontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./NodeBackend
    container_name: backend
    ports:
      - "3002:3002"
    env_file:
      - ./NodeBackend/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dam
      DB_USER: admin
      DB_PASSWORD: Admin123
      DB_URL: postgres://admin:Admin123@postgres:5432/dam
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:18.1-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: dam
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-06-06T02-44-06Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      # - MINIO_SERVER_URL=http://localhost:9000
    volumes:
      - minio_data:/mnt/data
      - ./minio/minio.license:/minio.license:ro
      - ./minio/certs:/etc/minio/certs:ro
    command: server --console-address ":9001" /data
    restart: always
    networks:
      - app-network

  worker:
    build: ./worker
    container_name: worker
    env_file:
      - ./worker/.env.production
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dam
      DB_USER: admin
      DB_PASSWORD: Admin123
      DB_URL: postgres://admin:Admin123@postgres:5432/dam
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitMQ
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI (Dashboard)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge
